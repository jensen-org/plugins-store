name: store

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate entries against the schema
        run: node scripts/validate.mjs
      - name: Verify every release exists and matches its checksum
        run: node scripts/verify.mjs
      - name: The catalog builds
        run: node scripts/build-index.mjs
      - name: The catalog is current before it reaches main
        if: github.base_ref == 'main'
        run: git diff --exit-code -- index.json
